# Lint and tests for every pull request and every push to main.
# Actions are pinned to a full commit SHA (tag in the comment); Dependabot proposes updates.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# The workflow only reads the repository; it uses no secrets.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs of a pull request, never the runs of main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint and tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The team works on Windows; Linux is the reference runner.
        # uv 0.13.6 (2026-10-27) is the first release that installs CPython 3.14.10 and it
        # includes the fix for GHSA-hq85-5cpj-mr62. Its SHA-256 per platform comes from the
        # release assets; Dependabot does not update them, so change both with the version.
        include:
          - os: ubuntu-latest
            uv-checksum: f29c3e94ffabd7e6f3ba521dba169a9b7ec12100bf3257087f0f24f6123f3645
          - os: windows-latest
            uv-checksum: a2a8820d5eea32f08ef467ef3b7f66883a9b076d5737a2fc2fbb5f458d1bb50f
    env:
      # Use the newest 3.14 patch that uv manages instead of whatever the runner has.
      UV_MANAGED_PYTHON: "1"
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: "0.13.6"
          checksum: ${{ matrix.uv-checksum }}
          # Two development dependencies do not justify a shared cache that pull requests could write.
          enable-cache: false

      - name: Install the locked environment
        run: uv sync --locked

      - name: Show versions
        run: |
          uv --version
          uv run python --version

      - name: Lint
        run: uv run ruff check

      - name: Check formatting
        run: uv run ruff format --check

      - name: Run tests
        run: uv run pytest
