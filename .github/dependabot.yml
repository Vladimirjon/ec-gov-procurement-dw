# Weekly update proposals for the CI actions and the Python development dependencies.
# The uv version and its checksums in .github/workflows/ci.yml are updated by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Only versions published at least two weeks ago, the rule used to pin the actions.
    # Security updates are not delayed by the cooldown.
    cooldown:
      default-days: 14
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore(deps)
