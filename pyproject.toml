[project]
name = "ec-gov-procurement-dw"
version = "0.0.0"
description = "Academic data warehouse on public procurement of Ecuador's central government."
readme = "README.md"
# Python line fixed by the team lead (ADR 0003). Keep it in sync with .python-version.
requires-python = "==3.14.*"
# No runtime dependencies yet: the scripts in scripts/ use only the standard library.
dependencies = []
# Not a distributable package: prevents accidental uploads to an index.
classifiers = ["Private :: Do Not Upload"]

[dependency-groups]
# Exact versions; uv.lock pins the transitive dependencies and their hashes.
dev = [
    "pytest==9.1.1",
    "ruff==0.17.1",
]

[tool.uv]
# Install only the environment, not the project itself: there is no package to build yet.
package = false
# 0.13.4 is the first release with the fix for GHSA-hq85-5cpj-mr62.
required-version = ">=0.13.4"

[tool.pytest]
minversion = "9.1"
testpaths = ["tests"]
# The scripts are standalone files, not a package: the tests import them from scripts/.
pythonpath = ["scripts"]
addopts = ["--import-mode=importlib", "-ra"]
# Unknown markers or options, non-strict xfail and duplicated parameter ids are errors.
strict = true
filterwarnings = ["error"]

[tool.ruff]
# The existing scripts use lines of up to 116 characters; 120 keeps them within the limit.
line-length = 120
# Apply the exclusions below even when a file is passed explicitly (editors, ad hoc commands).
force-exclude = true

[tool.ruff.format]
# scripts/inspect_sercop_zip.py and scripts/profile_sercop_fields.py are evidence: their SHA-256
# is recorded in docs/sources/*.json and docs/sources/reconocimiento.md, so the formatter must not
# rewrite them. A new version of a script is a new piece of evidence, not a reformat.
exclude = [
    "scripts/inspect_sercop_zip.py",
    "scripts/profile_sercop_fields.py",
]

[tool.ruff.lint]
# E, W: pycodestyle; F: pyflakes; I: import order; B: bugbear; UP: pyupgrade;
# SIM: simplifications; S: bandit security checks; RUF: ruff-specific rules.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "RUF"]

[tool.ruff.lint.isort]
# Match the existing scripts: `import x` and `from x import y` sorted together by module
# name, and two blank lines after the import block.
force-sort-within-sections = true
lines-after-imports = 2

[tool.ruff.lint.per-file-ignores]
# Evidence scripts with a recorded hash (see [tool.ruff.format]); they cannot be edited.
# UP017: `timezone.utc` instead of `datetime.UTC` is a style modernization, not a defect.
"scripts/inspect_sercop_zip.py" = ["UP017"]
"scripts/profile_sercop_fields.py" = ["UP017"]
# S101: pytest relies on plain `assert` statements.
# S603: the tests run the scripts with sys.executable and a fixed argument list, without a shell.
"tests/**/*.py" = ["S101", "S603"]
